services:
  # Backend API Service
  - type: web
    name: cinemoments-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: mongodb+srv://jegansselvendran2007_db_user:P1UcbYVvJTkYCh2Q@cinemoments.ice7cu6.mongodb.net/?retryWrites=true&w=majority
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FILE_ENCRYPTION_KEY
        value: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CLIENT_URL
        value: https://cinemoments-3sn2.onrender.com

  # Frontend Static Site
  - type: web
    name: cinemoments
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cinemoments-api-3sn2.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
